  - ABER-CKP
  - ESTADO-DHSV
  - ESTADO-M1
  - ESTADO-M2
  - ESTADO-PXO
  - ESTADO-SDV-GL
  - ESTADO-SDV-P
  - ESTADO-W1
  - ESTADO-W2
  - ESTADO-XO
  - P-ANULAR
  - P-JUS-CKGL
  - P-JUS-CKP
  - P-MON-CKP
  - P-PDG
  - P-TPT
  - QGL
  - T-JUS-CKP
  - T-MON-CKP
  - T-PDG
  - T-TPT
output_dir: outputs/3w_final_primary_grouped_seed42
resume: true
