mode: rapid_idea_validation
markers: [RAPID_IDEA_VALIDATION, SINGLE_SEED, SUBSET_DATA, NOT_FOR_PAPER_CLAIMS]
task: binary_fault_detection

dataset:
  name: tep
  version: rieth_2017
  source: harvard_dataverse
  doi: 10.7910/DVN/6C3JR1
  root: E:/Datasets/TEP_Rieth2017/raw
  run_id_column: simulationRun
  sample_column: sample
  fault_id_column: faultNumber
  operating_mode_column: null

fault_boundary:
  training: {last_normal_sample: 20, first_faulty_sample: 21}
  testing: {last_normal_sample: 160, first_faulty_sample: 161}

split:
  strategy: stratified_by_faultNumber
  train: 0.8
  validation: 0.2
  seed: 7
  official_testing_is_final_test: true

subset:
  training: {normal: 160, fault: 8}
  testing: {normal: 40, fault: 2}

transition_policy: exclude_transition
fault_ratio_threshold: 0.5
window_length: 64
stride: 16
scaler: standard
input_layout: BCL
model: {name: tcn, hidden_channels: 32, projection_dim: 32, levels: 3}
optimizer: adam
learning_rate: 0.001
batch_size: 128
epochs: 8
early_stopping_patience: 2
random_seed: 7
degradation: mcar_missing
degradation_severity: 0.3
degradation_space: normalized_space
loss: ce
supcon_weight: 0.1
temperature: 0.1
output_dir: outputs/rapid_idea_validation
device: cuda
num_workers: 0
diffusion:
  steps: 20
  hidden_channels: 64
  residual_blocks: 3
  epochs: 12
  early_stopping_patience: 2
  learning_rate: 0.001
