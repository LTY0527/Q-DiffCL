mode: real_data_smoke
markers: [REAL_DATA_SMOKE_TEST, NOT FOR SCIENTIFIC COMPARISON]
task: binary_fault_detection

dataset:
  name: tep
  version: rieth_2017
  source: harvard_dataverse
  doi: 10.7910/DVN/6C3JR1
  root: E:/Datasets/TEP_Rieth2017/raw
  run_id_column: simulationRun
  sample_column: sample
  fault_id_column: faultNumber
  feature_columns:
    measured: xmeas_1..xmeas_41
    manipulated: xmv_1..xmv_11
  operating_mode_column: null

fault_boundary:
  training:
    last_normal_sample: 20
    first_faulty_sample: 21
  testing:
    last_normal_sample: 160
    first_faulty_sample: 161

split:
  strategy: stratified_by_faultNumber
  train: 0.8
  validation: 0.2
  seed: 7
  official_testing_is_final_test: true

transition_policy: exclude_transition
fault_ratio_threshold: 0.5
window_length: 64  # Smoke Test 工程默认值，不是论文最终设置
stride: 16        # Smoke Test 工程默认值，不是论文最终设置
scaler: standard
input_layout: BCL
model: {name: tcn, hidden_channels: 16, projection_dim: 16, levels: 2}
optimizer: adam
learning_rate: 0.001
batch_size: 32     # Smoke Test 工程默认值
epochs: 1          # 仅用于 Smoke Test
random_seed: 7
degradation: none
degradation_severity: null
degradation_space: normalized_space
loss: ce
supcon_weight: 0.1
temperature: 0.1
output_dir: outputs/real_data_smoke
device: auto
num_workers: 0
smoke:
  max_runs_per_fault: 2

