mode: r2_multiclass_criticality
markers: [R2_MULTICLASS_CRITICALITY, TRAIN_ONLY_FAULT_TYPE_M, FIXED_WEIGHT_NO_SEARCH]
criticality_weights: &r2_weights
  weight_discriminative: 0.40
  weight_early: 0.24
  weight_run_stability: 0.16
  weight_multiclass: 0.20
three_w:
  base_config: configs/3w_diffusion_1seed.yaml
  original_manifest: outputs/3w_diffusion_3seed/result_manifest.json
  r1_criticality_source: outputs/3w_diffusion_1seed_seed42/result.json
  output_dir: outputs/r2_multiclass_criticality_3w_all_classes
  invalidated_preliminary_runs: 3
  invalidated_reason: preliminary M omitted the explicitly required normal class 0; outputs retained but excluded
  seeds: [42, 43, 44]
  protocol_seed: 42
  method: FREQUENCY_SELECTIVE_R2
  criticality_weights: *r2_weights
  gate:
    minimum_macro_f1_mean_gain: 0.020
    minimum_macro_f1_wins: 2
    minimum_multiclass_auprc_mean_gain: 0.0
    maximum_binary_auprc_mean_drop: 0.005
    maximum_single_binary_auprc_drop: 0.030
    maximum_far_mean_increase: 0.050
    maximum_class9_std_increase_ratio: 0.10
tep:
  base_config: configs/frequency_selective_r1_3seed.yaml
  previous_result: outputs/frequency_selective_r1_3seed/result.json
  output_dir: outputs/r2_multiclass_criticality_tep
  seeds: [7, 42, 2026]
  criticality_weights: *r2_weights
  markers: [R2_CROSS_DATASET_TRANSFER_CHECK, EXPLORATORY_TEP_SUBSET, NOT_FOR_PAPER_FINAL_CLAIMS]
  gate:
    minimum_macro_f1_wins_vs_c1: 2
    minimum_macro_f1_mean_gain_for_go: 0.005
    maximum_mean_auprc_drop: 0.005
    maximum_mean_recall_drop: 0.010
    maximum_mean_far_increase: 0.030
    maximum_mean_early_recall_drop: 0.010
    catastrophic_macro_f1_drop: 0.020
    catastrophic_auprc_drop: 0.030
    catastrophic_far_increase: 0.050
    catastrophic_early_recall_drop: 0.050
docs:
  three_w_report: docs/r2_multiclass_criticality_3w.md
  three_w_json: docs/r2_multiclass_criticality_3w.json
  three_w_results_csv: docs/r2_multiclass_criticality_3w_results.csv
  three_w_paired_csv: docs/r2_multiclass_criticality_3w_paired.csv
  tep_report: docs/r2_multiclass_criticality_tep.md
  tep_json: docs/r2_multiclass_criticality_tep.json
  summary_report: docs/r2_multiclass_criticality_summary.md
