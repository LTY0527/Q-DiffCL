[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-diffcl-baselines"
version = "0.1.0"
description = "Leakage-safe TEP fault-detection and contrastive-learning baselines"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "PyYAML>=6", "scikit-learn>=1.3", "torch>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["pyreadr>=0.5"]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: 读取外部真实 RData 的集成测试"]
